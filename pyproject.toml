[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitchain"
version = "1.0.0"
description = "Decentralized git contribution verifier — permissionless blockchain"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "zeroconf>=0.131.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
gitchain = "gitchain.cli.gitchain:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gitchain*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
